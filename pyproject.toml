[project]
name = "brainfilter"
authors = [{name = "Yael Balbastre", email = "y.balbastre@ucl.ac.uk"}]
maintainers = [{name = "Yael Balbastre", email = "y.balbastre@ucl.ac.uk"}]
description = "Build, read and filter BIDS trees on any storage backend"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
  "bagof-paths >= 0.4",
]
dynamic = ["version"]

[project.optional-dependencies]
# universal-pathlib provides the memory:// backend the tests run against;
# anyio's pytest plugin runs the async tests.
test = ["pytest", "universal-pathlib", "anyio", "pandas"]
# The documentation site (zensical + mkdocstrings).
docs = [
  "zensical >= 0.0.11",
  "mkdocstrings[python] >= 1.0.0",
  "markdown-grid-tables",
]


[project.urls]
Homepage = "https://github.com/balbasty/brainfilter"
Issues = "https://github.com/balbasty/brainfilter/issues"

[build-system]
requires = [
  "setuptools >= 61.0",
  "wheel",
  "versioningit >= 1.0",
]
build-backend = "setuptools.build_meta"

# Find packages explicitly: flat-layout auto discovery refuses to build when
# another top-level directory, such as the docs build output `site/`, exists.
[tool.setuptools.packages.find]
include = ["brainfilter*"]

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.vcs]
# Version used when the repository has no tag yet
default-tag = "0.1"

[tool.versioningit.format]
# Same format as versioneer
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "brainfilter/_version.py"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
  "brainfilter/tests"
]

[tool.codespell]
skip = "*.git,./build,*.egg-info"
ignore-words = "codespell-ignore-words.txt"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv"
]
line-length = 88
indent-width = 4
src = ["."]
target-version = "py310"

[tool.ruff.lint]
select = ["ANN", "D", "E", "F", "I"]
ignore = [
  "ANN002",  # args should not be annotated
  "ANN003",  # kwargs should not be annotated
  "D105",    # Missing docstring in magic method
  "D205"     # 1 blank line required between summary line and description -> triggered in __init__ docstrings
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"brainfilter/tests/*.py" = ["ANN", "D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
